<svg
  width="1600"
  height="260"
  viewBox="0 0 1600 260"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#07152D"/>
      <stop offset="100%" stop-color="#10051F"/>
    </linearGradient>

    <linearGradient id="mainGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#0878FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0878FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path
        d="M45 0H0V45"
        fill="none"
        stroke="#38BDF8"
        stroke-width="1"
        opacity="0.05"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="smallBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>


