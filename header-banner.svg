<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Background -->
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020817"/>
      <stop offset="0.5" stop-color="#071126"/>
      <stop offset="1" stop-color="#030817"/>
    </linearGradient>

    <!-- Blue glow -->
    <radialGradient id="blueGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(155 150) rotate(25) scale(260 210)">
      <stop stop-color="#008CFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#008CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1040 145) rotate(155) scale(270 220)">
      <stop stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud gradient -->
    <linearGradient id="cloudStroke" x1="55" y1="70" x2="310" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- AI gradient -->
    <linearGradient id="aiStroke" x1="875" y1="70" x2="1115" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Main text -->
    <linearGradient id="nameGradient" x1="390" y1="100" x2="810" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Cloud wave -->
    <linearGradient id="waveBlue" x1="0" y1="0" x2="600" y2="0">
      <stop stop-color="#0284C7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0EA5E9" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <!-- AI wave -->
    <linearGradient id="wavePurple" x1="600" y1="0" x2="1200" y2="0">
      <stop stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="blueBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="purpleBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Clip -->
    <clipPath id="bannerClip">
      <rect width="1200" height="360" rx="12"/>
    </clipPath>

  </defs>

